name: Manga Translate
run-name: "Task-${{ inputs.trigger_msg_id }}-${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      task_type:
        required: true
        type: string
      video_id:
        required: true
        type: string
      sub_id:
        required: false
        type: string
        default: ""
      chat_id:
        required: true
        type: string
      user_id:
        required: true
        type: string
      trigger_msg_id:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: "normal"

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TASK_TYPE: ${{ inputs.task_type }}
      VIDEO_ID: ${{ inputs.video_id }}
      SUB_ID: ${{ inputs.sub_id }}
      CHAT_ID: ${{ inputs.chat_id }}
      USER_ID: ${{ inputs.user_id }}
      TRIGGER_MSG_ID: ${{ inputs.trigger_msg_id }}
      MODE: ${{ inputs.mode }}
      BUBBLE_MODEL_PATH: models/comic-speech-bubble-detector.pt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Poppler is needed by pdf2image to rasterize PDF pages
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # CPU-only torch build first — the default PyPI torch wheel bundles CUDA
      # and is ~5x larger / slower to install, which we don't need on a
      # 2-CPU runner with no GPU anyway.
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cache both YOLO bubble detector and EasyOCR models (since they're stored in 'models')
      - name: Cache translation models
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models
          key: translation-models-v2

      - name: Download bubble detector model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L -o models/comic-speech-bubble-detector.pt \
            https://huggingface.co/ogkalu/comic-speech-bubble-detector-yolov8m/resolve/main/comic-speech-bubble-detector.pt

      - name: Run Manga Translator Worker
        run: python studio.py
